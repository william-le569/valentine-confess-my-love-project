<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>20/10 | Chúc Mừng Ngày Phụ Nữ Việt Nam ❤️</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        @font-face {
            font-family: 'DeArPix';
            src: url('./dearpix-1-94.ttf') format('truetype');
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            /* font-family: 'DeArPix', monospace; */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Fullscreen Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }

        /* Overlay Start Screen */
        #startOverlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #startOverlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .pulse-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .icon-circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: rgba(255, 42, 133, 0.15);
            border: 1.5px solid rgba(255, 105, 180, 0.6);
            box-shadow: 0 0 30px rgba(255, 42, 133, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            color: #ff69b4;
            font-size: 30px;
        }

        .tap-title {
            color: #ffffff;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px #ff2a85, 0 0 24px #ff2a85;
            text-align: center;
            font-size: clamp(1.1rem, 4.5vw, 1.6rem);
            padding: 0 16px;
            box-sizing: border-box;
        }

        .tap-sub {
            color: #ffb3d9;
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
            margin-top: 10px;
            opacity: 0.85;
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(0.96);
                opacity: 0.85;
            }
            50% {
                transform: scale(1.04);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <audio id="bgMusic" src="nhac-cua-toi-edited.mp3" loop></audio>
    <canvas id="mainCanvas"></canvas>

    <div id="startOverlay" onclick="startApp()">
        <div class="pulse-box">
            <div class="icon-circle">
                <i class="fa-solid fa-heart"></i>
            </div>
            <div class="tap-title">Chạm vào màn hình để bắt đầu ✨</div>
            <div class="tap-sub">20.10 | A Special Gift For You</div>
        </div>
    </div>

    <script>
        /* =========================================================
         * 1. CANVAS & MATRIX DIGITAL RAIN SYSTEM
         * ========================================================= */
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initMatrix();
        });

        const matrixWords = [
            "I LOVE YOU", "20/10", "HAPPY", "LOVE", "YÊU EM", 
            "MY LOVE", "ALWAYS", "FOREVER", "CUTE", "ANGEL", "BEAUTIFUL", "❤️"
        ];
        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789♥❤💕I LOVE YOU2010".split("");

        const fontSize = 14;
        let columns = Math.floor(width / fontSize);
        let drops = [];

        function initMatrix() {
            columns = Math.floor(width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = {
                    y: Math.random() * -100,
                    speed: 1 + Math.random() * 1.5,
                    text: getRandomMatrixText()
                };
            }
        }

        function getRandomMatrixText() {
            if (Math.random() < 0.15) {
                return matrixWords[Math.floor(Math.random() * matrixWords.length)];
            }
            return matrixChars[Math.floor(Math.random() * matrixChars.length)];
        }

        initMatrix();

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            ctx.fillRect(0, 0, width, height);

            ctx.font = `${fontSize}px 'Space Mono', monospace`;

            for (let i = 0; i < drops.length; i++) {
                const drop = drops[i];
                const x = i * fontSize;
                const y = drop.y * fontSize;

                const isBright = Math.random() < 0.08;
                ctx.fillStyle = isBright ? '#ffffff' : (Math.random() < 0.3 ? '#ff69b4' : '#ff2a85');
                ctx.shadowColor = '#ff2a85';
                ctx.shadowBlur = isBright ? 8 : 2;

                ctx.fillText(drop.text, x, y);
                ctx.shadowBlur = 0;

                if (y > height && Math.random() > 0.975) {
                    drops[i].y = 0;
                    drops[i].text = getRandomMatrixText();
                }

                drops[i].y += drop.speed;
            }
        }


        /* =========================================================
         * 2. HIGH-DENSITY LED DOT-MATRIX PARTICLE SYSTEM
         * ========================================================= */
        const textSequence = [
            ["Hôm nay 20.10"],
            ["Là ngày của em"],
            ["Chúc em", "luôn hạnh phúc"],
            ["Những điều", "tốt đẹp nhất"],
            ["Sẽ đến với em"],
            ["Luôn có người"],
            ["Thương em", "thật lòng"],
            ["Mà người đó"],
            ["Chính là anh!"],
            ["Cảm ơn em", "vì luôn bên anh"] 
        ];

        let currentTextIndex = 0;
        let particles = [];
        let heartParticles = [];
        let isSequenceRunning = false;
        let sequencePhase = 'IDLE'; 
        let phaseTimer = 0;

        class Particle {
            constructor(x, y) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.originX = x;
                this.originY = y;
                
                this.color = '#ffffff';
                
                // Bán kính hạt chấm tròn LED chuẩn
                // this.size = width < 600 ? 1.8 : 2.2;
                this.size = 1.5; 
                
                this.vx = (Math.random() - 0.5) * 22;
                this.vy = (Math.random() - 0.5) * 22;
                this.ease = 0.09 + Math.random() * 0.04;
                this.friction = 0.91;
            }

            update() {
                if (sequencePhase === 'CONVERGING' || sequencePhase === 'HOLDING') {
                    const dx = this.originX - this.x;
                    const dy = this.originY - this.y;
                    
                    this.x += dx * this.ease;
                    this.y += dy * this.ease;

                } else if (sequencePhase === 'EXPLODING') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= this.friction;
                    this.vy *= this.friction;
                }
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                
                // Tạo hiệu ứng phát sáng nhẹ chuẩn đốm đèn LED
                if (sequencePhase === 'HOLDING') {
                    ctx.shadowBlur = 1;
                    ctx.shadowColor = '#ffffff';
                } else {
                    ctx.shadowBlur = 0;
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function getHeartFrame(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return {
                x: width / 2 + x * scale,
                y: height / 2 - 20 + y * scale
            };
        }

        class HeartEmitParticle {
            constructor() {
                this.reset();
            }

            reset() {
                const scale = Math.min(width, height) / 35;
                const t = Math.random() * Math.PI * 2;
                const pt = getHeartFrame(t, scale);

                this.x = pt.x;
                this.y = pt.y;

                const angle = Math.atan2(this.y - (height / 2 - 20), this.x - width / 2) + (Math.random() - 0.5) * 0.4;
                const speed = Math.random() * 2.5 + 0.8;

                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;

                this.size = 2.0; 
                this.maxLife = Math.random() * 35 + 20;
                this.life = this.maxLife;

                const colors = ['#ff1493', '#ff69b4', '#ff3385', '#ffffff', '#ffb6c1'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;

                if (this.life <= 0) {
                    this.reset();
                }
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ff1493';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /* =========================================================
         * THUẬT TOÁN QUÉT ẢNH HIGH-DENSITY RASTERIZATION (SẮC NÉT NHƯ MẪU)
         * ========================================================= */
        function getPixelCoordinates(textLines) {
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            
            offCanvas.width = width;
            offCanvas.height = height;

            // Kích thước chữ tối ưu để đảm bảo các nét uốn tiếng Việt được đầy đủ
            let fontPixelSize = width < 600 ? 46 : 64;

            // Dùng Font Montserrat Heavy (900)
            offCtx.font = `700 ${fontPixelSize}px 'Montserrat', sans-serif`;
            // offCtx.font = `700 ${fontPixelSize}px 'DeArPix', monospace`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = '#ffffff';

            const lineHeight = fontPixelSize * 1.38;
            const totalHeight = textLines.length * lineHeight;
            let startY = (height / 2) - (totalHeight / 2) + (lineHeight / 2);

            textLines.forEach((line, index) => {
                offCtx.fillText(line, width / 2, startY + (index * lineHeight));
            });

            const imageData = offCtx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const points = [];

            // Tinh chỉnh bước nhảy bước lưới (Step 2.5 - 3.2px) giúp hạt nằm sát khít
            const step = width < 600 ? 3 : 4;
            // const step = 6; 

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const alphaIndex = (y * width + x) * 4 + 3;
                    
                    // Lọc độ trong suốt của nét chữ vector
                    if (data[alphaIndex] > 110) {
                        // Grid Snapping: Ép tọa độ tròn vào đúng các ô ma trận song song
                        const snappedX = Math.floor(x / step) * step;
                        const snappedY = Math.floor(y / step) * step;

                        points.push({ x: snappedX, y: snappedY });
                    }
                }
            }

            return points;
        }

        function loadNextPhrase() {
            if (currentTextIndex >= textSequence.length) {
                sequencePhase = 'HEART';
                heartParticles = [];
                for (let i = 0; i < 350; i++) {
                    heartParticles.push(new HeartEmitParticle());
                }
                return;
            }

            const textLines = textSequence[currentTextIndex];
            const targets = getPixelCoordinates(textLines);

            particles = [];
            for (let i = 0; i < targets.length; i++) {
                particles.push(new Particle(targets[i].x, targets[i].y));
            }

            sequencePhase = 'CONVERGING';
            phaseTimer = Date.now();
        }

        function updateParticleSequence() {
            if (!isSequenceRunning) return;

            const now = Date.now();

            if (sequencePhase === 'CONVERGING') {
                if (now - phaseTimer > 1800) {
                    sequencePhase = 'HOLDING';
                    phaseTimer = now;
                }
            } else if (sequencePhase === 'HOLDING') {
                if (now - phaseTimer > 2500) {
                    sequencePhase = 'EXPLODING';
                    
                    particles.forEach(p => {
                        const angle = Math.random() * Math.PI * 2;
                        const force = 16 + Math.random() * 24;
                        p.vx = Math.cos(angle) * force;
                        p.vy = Math.sin(angle) * force;
                    });
                    
                    phaseTimer = now;
                }
            } else if (sequencePhase === 'EXPLODING') {
                if (now - phaseTimer > 800) {
                    currentTextIndex++;
                    loadNextPhrase();
                }
            }

            if (sequencePhase === 'HEART') {
                heartParticles.forEach(hp => {
                    hp.update();
                    hp.draw();
                });
                drawCenterHeartText();
            } else {
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
            }
        }

        function drawCenterHeartText() {
            ctx.save();
            let fontSizeCenter = width < 600 ? 32 : 46;

            ctx.fillStyle = '#ffffff';
            ctx.font = `700 ${fontSizeCenter}px 'Montserrat', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ff1493';
            ctx.fillText("Yêu Vợ", width / 2, height / 2 - 20);
            ctx.restore();
        }


        /* =========================================================
         * 3. MAIN ANIMATION LOOP
         * ========================================================= */
        function mainLoop() {
            drawMatrix();
            updateParticleSequence();
            requestAnimationFrame(mainLoop);
        }

        // Đảm bảo Font Montserrat tải xong hoàn toàn trước khi render
        document.fonts.load("700 24px 'Montserrat'").then(() => {
            mainLoop();
        }).catch(() => {
            mainLoop();
        });


        /* =========================================================
         * 4. APP CONTROL & AUDIO SYSTEM
         * ========================================================= */
        const bgMusic = document.getElementById('bgMusic');
        function startApp() {
            document.getElementById('startOverlay').classList.add('fade-out');
            bgMusic.play().catch(error => {
                console.log("Trình duyệt chặn phát tự động: ", error);
            });

            setTimeout(() => {
                isSequenceRunning = true;
                loadNextPhrase();
            }, 300);
        }
    </script>
</body>
</html>
